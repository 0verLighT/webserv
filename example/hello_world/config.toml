[server]
port = 8080
#TODO: never used?
host = "0.0.0.0"
server_name = "localhost"
file = "example/hello_world/hello_world.sh"
executor = "/usr/bin/bash"
cgi_enabled = true
autoindex = true
timeout = 20000
root = "html"
default_error_page = "error.html"
max_body_size = 1048576

[server.route]
root = "html"
methods = ["GET", "POST", "DELETE"]
autoindex = true

[server.routes."/post"]
root = "example/post"
methods = ["GET", "POST"]
cgi_enabled = true
cgi_extension = ".sh"
executor = "/usr/bin/bash"
